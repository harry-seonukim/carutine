name: Android APK

on:
  push:
    branches: [main, 'fe/**', 'pm/**']
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  # 공모전 규칙: apk/팀명_앱이름_release.apk
  APK_NAME: ${{ vars.APK_NAME || 'Carutine_release.apk' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-configuration-cache :app:testDebugUnitTest --stacktrace
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "CARUTINE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi
      - name: Build release APK
        env:
          CARUTINE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CARUTINE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CARUTINE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache :app:assembleRelease --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          f=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$f" "out/$APK_NAME"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs "out/$APK_NAME" | head -5 || true
          $BT/aapt2 dump badging "out/$APK_NAME" | head -8 || true
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/
